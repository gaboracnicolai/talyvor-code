name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - run: cd extension && npm install
      - run: cd extension && npm run compile
      - run: cd extension && npx tsc --noEmit
      # Two suites, named separately so the CI log shows each one executing rather than a
      # single opaque green tick. `npm test` runs both (see package.json) — the split here
      # is for legibility, not coverage.
      #
      # AUDIT FINDING: the path-confinement tests live under src/ and CI only ever ran
      # out/test/**, so the five tests proving the agent REFUSES to write outside a
      # customer's workspace root had never executed. They compiled, and that was all.
      # The .vsix ships extension/LICENSE, not the repo root one — vsce packages only the
      # extension directory. A copied licence that drifts from the root would mean the
      # published extension states different terms from the repository, which is a legal
      # hazard rather than a tidiness one. Assert they are byte-identical.
      - name: extension licence matches the repo licence
        run: |
          cmp LICENSE extension/LICENSE
          node -e "const l=require('./extension/package.json').license; if(!l){console.error('::error::extension/package.json has no license field — VS Code Marketplace rejects unlicensed extensions'); process.exit(1)} console.log('extension license field:', l)"

      - name: unit tests (includes agent path confinement)
        run: cd extension && npm run test:unit
      - name: VS Code integration tests
        run: cd extension && npm run test:integration

      # BUILD the .vsix — do not publish. Packaging was broken three independent ways and
      # each was invisible until someone tried: `vsce` was not installed, `main` pointed at
      # ./out/extension.js while tsc emits out/src/extension.js, and no .vscodeignore existed
      # so vsce fell back to .gitignore and dropped the whole out/ directory. Building it on
      # every PR is what stops that drifting back.
      - name: package the extension (build only, never publish)
        run: |
          cd extension && npm run package
          ls -la ./*.vsix
          # vsce renames LICENSE -> LICENSE.txt inside the package, so match that exact name
          # rather than relying on a substring happening to align.
          unzip -l ./*.vsix | grep -q 'extension/LICENSE.txt' || { echo "::error::.vsix does not contain the licence"; exit 1; }
          unzip -l ./*.vsix | grep -q 'out/src/extension.js' || { echo "::error::.vsix is missing its entrypoint"; exit 1; }
          echo "vsix contains its licence and entrypoint"

      # The two assertions above check the licence and the entrypoint. NEITHER CAN SEE A MISSING
      # README — and `vsce package` does not warn about one, measured at 2124b47: the .vsix it
      # built had zero readme entries and exited 0. On the Marketplace the README *is* the
      # description page, so that artefact publishes a listing with a blank body. The script
      # reads the ARCHIVE rather than the working tree, so a .vscodeignore that excludes the
      # README cannot leave it green.
      - name: the .vsix carries a listing (readme, changelog, correct extension id)
        run: cd extension && ./scripts/check-vsix-listing.sh ./talyvor-code-*.vsix ./package.json

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # ⚠ DERIVED FROM agent/go.mod, NOT A LITERAL. This file carried THREE literal
          # `go-version: "1.25"` pins — three numbers that can drift from go.mod and from each
          # other, in the direction of testing and shipping a runtime nobody measured.
          # talyvor-suite measured that cost the same night: its literal resolved to go1.25.0 and
          # CI shipped a binary with 32 CALLED stdlib vulnerabilities. Enforced by
          # agent/govulncheck_gate_test.go.
          go-version-file: agent/go.mod
          # The Go module lives at agent/go.mod, not the repo root, so setup-go's
          # cache logged "Restore cache failed: go.mod not found". Point it at the
          # real dependency file so the module cache populates.
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: |
          cd agent
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: cd agent && go vet ./...
      - run: cd agent && go test -race -count=1 ./...
      # Control scripts that mutate a tracked file and put it back must restore in a
      # `finally` AND install a signal handler — a `finally` does not run on SIGTERM.
      # talyvor-suite lost a shell gate to exactly this (78c69c8) with a green suite and a
      # `git status` that showed nothing wrong. Ported here in W3.63, with the population
      # definition WIDENED: suite keys on "restores in a `finally`", which in this repo saw
      # 3 of the 6 scripts and missed the three that restore only on the happy path — the
      # strictly more dangerous shape. Detection is `ast`, never grep: a regex reads a
      # sentence of English in a comment as an installed handler.
      - name: control scripts restore the tree on a signal
        run: python3 scripts/check-restore-signal-handlers.py --ci
      # A control campaign rots from two ends and neither is visible unless somebody runs
      # it by hand and reads the output: the ANCHOR it mutates can drift, and the TESTS it
      # expects to break can be renamed away. w420's C4 had both — the anchor drifted when
      # GetIssue grew its by-identifier fallback, and its `want` set named
      # GetIssue_SendsTheIdentifierWhereTrackReadsAnID, a test deleted in the same refactor.
      # The louder rot hid the quieter one: the run aborted before the set was compared.
      # The full campaign mutates tracked files and runs the suite per control, so it cannot
      # go here. This half is pure string work over the tree — no mutation, no `go test`,
      # ~0.1s. (It proves each control can still be APPLIED and that the names it expects
      # exist; NOT that the mutation still CATCHES them. The campaign proves that.)
      - name: wire-contract control anchors and expected tests must still exist
        run: python3 scripts/w420-track-wire-controls-p3n7.py --check-anchors --ci

  # Supply-chain gate: govulncheck against the Go vulnerability DB.
  #
  # ⚠ THERE WAS NONE, AND THE ABSENCE IS THE FINDING (W6.36). Measured on clean main
  # `386df344`: `govulncheck ./...` in agent/ reported EIGHT CALLED vulnerabilities — CALLED, not
  # the separate "in modules you require but your code doesn't appear to call" bucket it counts on
  # its own line — and this file contained the word govulncheck zero times. Every one of the eight
  # is the STANDARD LIBRARY, not a dependency: net/http, crypto/tls ×2, crypto/x509, net/url,
  # net/textproto, encoding/asn1.
  #
  # ⚠⚠ AND THIS REPO SHIPS BINARIES. The `release` job below cross-compiles five artifacts that
  # install.sh hands to customers. Whatever stdlib that job's Go pin resolves to is the stdlib in
  # every one of them, and nothing measured it.
  #
  # ⚠⚠⚠ IT USES `go-version-file`, DELIBERATELY, AND SO DO THE agent AND release JOBS NOW.
  # govulncheck grades the STDLIB against the toolchain it runs under, so this gate is only honest
  # if it runs the Go this repo actually ships. Three literal `go-version: "1.25"` pins in one file
  # are three numbers that can drift from agent/go.mod and from each other — talyvor-suite measured
  # what that costs: with no toolchain directive its literal resolved to go1.25.0 and CI shipped a
  # binary with 32 called stdlib vulnerabilities while a developer's laptop, on a newer default
  # toolchain, reported nine. Deriving every pin from agent/go.mod removes the drift instead of
  # detecting it, and agent/govulncheck_gate_test.go keeps it derived.
  #
  # Landed RED on purpose, before the toolchain floor that clears it; the PR's check history is
  # the evidence. A gate nobody has watched fail is the same thing as no gate.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: report the Go this job actually runs
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          cd agent && "$(go env GOPATH)/bin/govulncheck" ./...

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan for secrets
        run: |
          # PINNED BY DIGEST. This was ghcr.io/gitleaks/gitleaks:latest — the only unpinned
          # dependency in a workflow where every actions/* is pinned to a full commit SHA.
          # An unpinned scanner is a scanner somebody else controls: a bad :latest can turn
          # the secret gate green (or red) without a commit here. v8.30.1 at time of pinning.
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-git --redact --config=/repo/.gitleaks.toml

  jetbrains:
    runs-on: ubuntu-latest
    # Honest, BLOCKING gate: it runs the committed gradle wrapper against the JVM
    # JUnit suite and fails the build on a real test failure (no continue-on-error).
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version: "17"
          distribution: "temurin"
          # Caches ~/.gradle/caches (incl. the IntelliJ Platform SDK, which the
          # gradle-intellij plugin pulls as a Gradle dependency) + ~/.gradle/wrapper,
          # keyed on the gradle build files — so this blocking job isn't a multi-minute
          # SDK download on every merge.
          cache: gradle
      # The wrapper (gradlew + gradle-wrapper.jar) is committed, so ./gradlew
      # self-provisions Gradle 8.7 — no `gradle` preinstall / wrapper-generation step.
      - name: Test + build JetBrains plugin
        run: cd jetbrains && ./gradlew test buildPlugin --no-daemon

  # THE RELEASE JOB THE README ALREADY DOCUMENTED.
  #
  # README:241 described this job — "Tagged builds (v*) trigger the release job, which
  # cross-compiles talyvor-code for darwin/arm64, darwin/amd64, linux/amd64, and
  # windows/amd64, then attaches the binaries to a GitHub release" — and it did not exist.
  # Zero releases, zero tags, nothing to install. Same shape as the Lens comment that
  # asserted a business model the code never had: a documented capability that isn't.
  #
  # It is built rather than the claim deleted, because install.sh needs real artifacts to
  # download and there is otherwise no way for a customer to obtain the CLI at all.
  #
  # `needs: [agent, extension]` so a tag can never publish a binary that failed its tests.
  # checksums.txt is part of the release, not a nicety: install.sh REFUSES to install
  # without a matching SHA-256, so a release without it installs nothing.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [agent, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # ⚠ THE SHIPPED RUNTIME. This job cross-compiles the five artifacts install.sh hands to
          # customers, so whatever Go it installs IS the stdlib inside every one of them. Derived
          # from agent/go.mod so it cannot differ from the version the agent job tested and the
          # vuln job scanned — which is the whole point of having one source of truth.
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Cross-compile the four documented targets
        run: |
          cd agent
          mkdir -p ../dist
          # Asset names must match what install.sh derives from uname:
          #   talyvor-code-${OS}-${ARCH}   (darwin|linux × amd64|arm64)
          # Windows keeps the .exe suffix and is fetched manually from the release page.
          build() {
            local goos="$1" goarch="$2" suffix="${3:-}"
            echo "  → ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags="-w -s -X main.version=${GITHUB_REF_NAME}" \
              -o "../dist/talyvor-code-${goos}-${goarch}${suffix}" ./cmd/agent
          }
          build darwin arm64
          build darwin amd64
          build linux  amd64
          build linux  arm64
          build windows amd64 .exe

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          echo "── checksums.txt ──"
          cat checksums.txt

      # Verify the artifacts the way install.sh will, before publishing rather than after a
      # customer reports it. Catches a truncated build or a stale dist/ entry.
      - name: Self-check — every asset verifies against checksums.txt
        run: |
          cd dist
          sha256sum -c checksums.txt
          test -s talyvor-code-linux-amd64
          echo "all assets present and verified"

      - name: Publish release with binaries + checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
